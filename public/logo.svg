<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hexagon glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagon gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e88f5" />
      <stop offset="100%" stop-color="#00d8ff" />
    </linearGradient>

    <!-- Radar sweep gradient -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00d8ff" stop-opacity="0.05" />
    </radialGradient>
  </defs>

  <rect width="250" height="250" fill="#000000" />

  <g transform="translate(125, 125)">
    <!-- Outer dashed circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1c485c" stroke-width="2.5" stroke-dasharray="10 15" />

    <!-- Radar sweep wedge (top right quadrant) -->
    <path d="M 0 0 L 0 -100 A 100 100 0 0 1 100 0 Z" fill="url(#sweepGrad)" />

    <!-- Radar blip -->
    <circle cx="65" cy="-45" r="9" fill="#000000" opacity="0.6" />
    <circle cx="65" cy="-45" r="5" fill="#00d8ff" />
    <circle cx="65" cy="-45" r="5" fill="none" stroke="#00d8ff" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="5;15" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Glowing Hexagon -->
    <polygon 
      points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" 
      fill="none" 
      stroke="url(#hexGrad)" 
      stroke-width="7" 
      filter="url(#glow)"
      stroke-linejoin="round"
    />

    <!-- Code Brackets -->
    <path d="M -15,-20 L -30,0 L -15,20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15,-20 L 30,0 L 15,20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
